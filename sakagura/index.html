<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>石川県の酒蔵パンフレット</title>
<style>
:root{--ink:#171b18;--paper:#f7f6f1;--canvas:#d9d9d4;--chrome:#111714}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#f2f1ed,#d9d9d4 46rem);color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}button,output{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding:22px 28px 72px}.header{width:min(1180px,100%);margin:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;color:#f7f8f5;background:var(--chrome);padding:22px 26px 20px}.eyebrow,.note{margin:0;color:#aeb7b0;font-size:10px;letter-spacing:.22em}.header h1{margin:3px 0 5px;font:600 28px/1.2 "Yu Mincho","Hiragino Mincho ProN",serif;letter-spacing:.13em}.tools{display:grid;grid-template-columns:58px 40px 36px 60px 36px;border:1px solid #424a45}.tools a,.tools button,.tools output{height:34px;display:grid;place-items:center;color:#fff;background:transparent;border:0;border-right:1px solid #424a45;text-decoration:none}.tools a{font-size:10px;font-weight:700;letter-spacing:.08em}.tools output{color:#bcc4be;font-size:11px}.tools a:hover,.tools button:hover{background:#29312c}.tabs{width:min(1180px,100%);margin:0 auto 20px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid #c7c9c5}.tabs button{min-height:44px;border:0;border-right:1px solid #e0e1de;background:#f6f6f4;color:#7e837f;font-size:12px;letter-spacing:.12em}.tabs button.active{color:#163d27;background:#fff;box-shadow:inset 0 -3px #23723f;font-weight:700}.tabs span{margin-left:7px;font-size:10px}.stage{overflow-x:auto;padding:16px 0 44px}.scaler{min-width:690px;max-width:1080px;margin:auto;transition:width .18s}.page{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(40,50,42,.018) 0 1px,transparent 1px 4px),linear-gradient(145deg,#fff,var(--paper));border:1px solid #c5c6bf;box-shadow:0 22px 60px #191c1933,0 2px 4px #191c1924;padding:4.1% 4.2% 5.2%}.grid{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:1.35%}.region,.card{min-width:0;min-height:0}.region{padding:4.4%;color:#fff;background:var(--color);box-shadow:inset 0 0 24px #00000012}.region>div{height:100%;border:1px solid #ffffffb8;display:flex;align-items:center;justify-content:center;gap:.45em;writing-mode:vertical-rl;font:clamp(20px,2.4vw,36px) "Yu Mincho",serif;letter-spacing:.24em}.card{position:relative;padding:3.5% 3.7% 3.8%;background:#ffffffb8;border:1px solid #d5d4cd;border-top:clamp(4px,.46vw,7px) solid var(--color);box-shadow:0 5px 11px #1d1f1d1a;overflow:hidden;cursor:zoom-in}.card:hover,.card:focus-visible{z-index:2;transform:translateY(-2px);outline:2px solid var(--color);outline-offset:-2px}.cardhead{display:grid;grid-template-columns:minmax(0,1fr) 30%;gap:3%}.brandline{display:flex;align-items:center;gap:4%;border-bottom:1px solid #7c817d;padding-bottom:2%}.num{flex:0 0 auto;width:clamp(20px,2.5vw,34px);aspect-ratio:1;display:grid;place-items:center;border-radius:50%;color:#fff;background:var(--color);font:clamp(11px,1.25vw,18px) Georgia,serif}.reading{margin:0 0 -.2em;font-size:clamp(6px,.63vw,9px);font-weight:700;letter-spacing:.32em;text-align:center}.brandline h2{margin:0;font:600 clamp(19px,2.35vw,34px)/1.08 "Yu Mincho",serif;white-space:nowrap}.brandline h2.long{font-size:clamp(15px,1.78vw,27px);letter-spacing:-.035em}.images{display:grid;grid-template-rows:1fr 1fr;gap:3px;min-height:clamp(72px,9vw,132px);border:1px solid #c5c6c0;padding:3px;background:#f2f1ed}.images div{background:repeating-linear-gradient(135deg,transparent 0 8px,#464a460a 8px 9px),linear-gradient(#eeede8,#e2e2dc)}.meta{margin-top:3.3%;font-size:clamp(6.2px,.64vw,9.5px);line-height:1.47}.meta p,.contacts p{margin:0}.meta b{margin-right:.25em}.contacts{margin-top:3%;font:clamp(5.9px,.62vw,9px)/1.34 Arial,sans-serif}.contacts p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.contacts span{display:inline-grid;min-width:2.9em;margin-right:.45em;place-items:center;color:#fff;background:var(--color);font-size:.72em;font-weight:800}.rule{height:1px;margin:3.1% 0 2.6%;background:#989b97}.copy+.copy{margin-top:2.25%}.copy h3{margin:0 0 1.1%;display:flex;align-items:center;gap:.42em;font-size:clamp(6.8px,.69vw,10px)}.copy h3 i{width:.72em;aspect-ratio:1;border-radius:50%;background:var(--color)}.copy p{margin:0;font:500 clamp(6.2px,.625vw,9.1px)/1.62 "Yu Mincho",serif;text-align:justify}.dense .copy p{font-size:clamp(5.8px,.58vw,8.5px);line-height:1.48}.ultra .copy p{font-size:clamp(5.35px,.54vw,7.9px);line-height:1.46}.folio{position:absolute;left:4.2%;right:4.2%;bottom:1.6%;display:flex;justify-content:space-between;color:#989d99;font-size:clamp(5px,.55vw,8px);letter-spacing:.18em}.printpages{display:none}.backdrop{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:28px;background:#0d110ebe}.detail{position:relative;width:min(720px,100%);max-height:calc(100vh - 56px);overflow:auto;padding:42px 48px 46px;background:#fbfaf6;border-top:8px solid var(--color);box-shadow:0 30px 90px #0006}.close{position:absolute;top:15px;right:16px;width:34px;height:34px;border:1px solid #b8bab5;border-radius:50%;background:transparent;font-size:23px}.dregion,.dreading{margin:0;color:var(--color);font-size:11px;font-weight:800;letter-spacing:.18em}.dreading{margin-top:24px;color:#5f655f;text-align:center}.detail>h2{margin:0 0 28px;padding-bottom:14px;border-bottom:1px solid #8b8f8b;font:600 clamp(36px,6vw,58px)/1.15 "Yu Mincho",serif;text-align:center}.facts{margin:0;display:grid;gap:1px;background:#dadbd6;border:1px solid #dadbd6}.facts div{display:grid;grid-template-columns:94px 1fr;background:#f8f7f3}.facts dt,.facts dd{margin:0;padding:10px 13px;font-size:13px;line-height:1.65}.facts dt{color:#fff;background:var(--color);font-weight:800}.detailcopy{margin-top:28px}.detailcopy .copy{margin-top:22px}.detailcopy .copy h3{font-size:15px}.detailcopy .copy p{font-size:14px;line-height:2}.error{padding:8%;font-family:sans-serif}.error code{background:#eee;padding:.15em .35em}.printpages{display:none}@media(max-width:720px){.app{padding:12px 12px 40px}.header{align-items:center;padding:17px 16px}.header h1{font-size:21px}.note,.eyebrow{font-size:8px}.tabs span{display:none}.stage{margin-inline:-12px;padding-inline:12px}.scaler{margin:0}.tools{grid-template-columns:46px 34px 32px 44px 32px}.backdrop{align-items:end;padding:0}.detail{width:100%;max-height:88vh;padding:38px 22px 34px}}@media print{@page{size:180mm 240mm;margin:0}body{background:#fff}.header,.tabs,.stage,.backdrop{display:none}.app{padding:0}.printpages{display:block}.printpages .page{width:180mm;height:240mm;aspect-ratio:auto;border:0;box-shadow:none;break-after:page}.printpages .page:last-child{break-after:auto}}
</style>
</head>
<body>
<main class="app"><header class="header"><div><p class="eyebrow">ISHIKAWA SAKE BREWERIES</p><h1>石川県の酒蔵</h1><p class="note" id="note">酒蔵データを読み込み中</p></div><div class="tools"><a href="./ishikawa_sake.json" download>JSON</a><button id="print" aria-label="印刷">印</button><button id="minus" aria-label="縮小">−</button><output id="zoom">74%</output><button id="plus" aria-label="拡大">＋</button></div></header><nav class="tabs" id="tabs"></nav><div class="stage"><div class="scaler" id="scaler" style="width:74%"></div></div><div class="printpages" id="printpages"></div><div id="modal"></div></main>
<script>
(()=>{"use strict";
const colors={能登:"#23723f",金沢:"#17468d",加賀:"#a44b23"};
const pages=[{label:"01",region:"能登",slots:["能登",1,2,3,4,5,6,7,8]},{label:"02",region:"能登・金沢",slots:[9,10,11,12,13,14,15,"金沢",16]},{label:"03",region:"金沢・加賀",slots:[17,18,19,20,"加賀",21,22,23,24]},{label:"04",region:"加賀",slots:["加賀",25,26,27,28,29,30,31,32]}];
const state={page:0,zoom:74,byId:null};
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const contacts=b=>[...b.contacts.telephone.map(v=>["TEL",v]),...b.contacts.fax.map(v=>["FAX",v]),...b.contacts.websites.map(v=>["WEB",v]),...b.contacts.emails.map(v=>["MAIL",v])];
const copy=(title,text)=>text?`<section class="copy"><h3><i></i>${esc(title)}</h3><p>${esc(text)}</p></section>`:"";
const region=r=>`<section class="region" style="--color:${colors[r]}"><div><span>${r}</span><span>の</span><span>酒蔵</span></div></section>`;
function card(b,active){const n=b.history.length+(b.brand_origin||"").length,d=n>430||b.addresses.length>1?"ultra":n>320?"dense":"",addresses=b.addresses.map(a=>`<p><b>［${esc(a.type)}］</b>${esc(a.raw)}</p>`).join(""),list=contacts(b).map(([k,v])=>`<p><span>${k}</span>${esc(v)}</p>`).join("");return `<article class="card ${d}" style="--color:${colors[b.region]}" ${active?`role="button" tabindex="0" data-id="${b.id}"`:""}><header class="cardhead"><div><div class="brandline"><span class="num">${b.id}</span><div><p class="reading">${esc(b.brand.reading)}</p><h2 class="${b.brand.display_name.length>=6?"long":""}">${esc(b.brand.display_name)}</h2></div></div><div class="meta"><p><b>［蔵元名］</b>${esc(b.producer.name)}</p>${addresses}<p><b>［創　業］</b>${esc(b.founded.display)}</p></div><div class="contacts">${list}</div></div><div class="images"><div></div><div></div></div></header><div class="rule"></div>${copy("蔵の沿革・歴史",b.history)}${copy("銘柄の由来",b.brand_origin)}</article>`}
function page(p,i,active){return `<section class="page"><div class="grid">${p.slots.map(s=>typeof s==="string"?region(s):card(state.byId.get(s),active)).join("")}</div><footer class="folio"><span>ISHIKAWA SAKE BREWERIES</span><span>${String(i+1).padStart(2,"0")} / 04</span></footer></section>`}
function render(){ $("#tabs").innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${i===state.page?"active":""}">${p.label} <span>${p.region}</span></button>`).join("");$("#scaler").innerHTML=page(pages[state.page],state.page,true)}
function detail(id){const b=state.byId.get(Number(id)),cs=contacts(b).map(x=>x[1]).join(" / ")||"掲載なし";$("#modal").innerHTML=`<div class="backdrop"><section class="detail" style="--color:${colors[b.region]}" role="dialog" aria-modal="true"><button class="close" aria-label="閉じる">×</button><p class="dregion">${b.region}の酒蔵　NO. ${b.id}</p><p class="dreading">${esc(b.brand.reading)}</p><h2>${esc(b.brand.display_name)}</h2><dl class="facts"><div><dt>蔵元名</dt><dd>${esc(b.producer.name)}</dd></div><div><dt>所在地</dt><dd>${b.addresses.map(a=>esc(a.type+"："+a.full)).join(" / ")}</dd></div><div><dt>創業</dt><dd>${esc(b.founded.display)}</dd></div><div><dt>連絡先</dt><dd>${esc(cs)}</dd></div></dl><div class="detailcopy">${copy("蔵の沿革・歴史",b.history)}${copy("銘柄の由来",b.brand_origin||"掲載データなし")}</div></section></div>`}
const close=()=>$("#modal").innerHTML="",setZoom=()=>{$("#scaler").style.width=state.zoom+"%";$("#zoom").textContent=state.zoom+"%"};
document.addEventListener("click",e=>{const t=e.target.closest("[data-page]"),c=e.target.closest(".card[data-id]");if(t){state.page=+t.dataset.page;render()}else if(c)detail(c.dataset.id);else if(e.target.closest(".close")||e.target.classList.contains("backdrop"))close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")return close();const c=e.target.closest?.(".card[data-id]");if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();return detail(c.dataset.id)}if($(".backdrop"))return;if(e.key==="ArrowRight"){state.page=Math.min(3,state.page+1);render()}if(e.key==="ArrowLeft"){state.page=Math.max(0,state.page-1);render()}});
$("#minus").onclick=()=>{state.zoom=Math.max(54,state.zoom-10);setZoom()};$("#plus").onclick=()=>{state.zoom=Math.min(100,state.zoom+10);setZoom()};$("#print").onclick=()=>print();
fetch("./ishikawa_sake.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{state.byId=new Map(data.breweries.map(b=>[b.id,b]));$("#note").textContent=`石川県内 全${data.record_count}蔵を掲載`;render();$("#printpages").innerHTML=pages.map((p,i)=>page(p,i,false)).join("")}).catch(err=>{$("#note").textContent="酒蔵データを読み込めませんでした";$("#scaler").innerHTML=`<section class="page error"><h2>ishikawa_sake.json を読み込めません</h2><p>このHTMLと <code>ishikawa_sake.json</code> を同じフォルダに置き、Webサーバー経由で開いてください。</p><p>${esc(err.message)}</p></section>`});
})();
</script>
</body>
</html>
